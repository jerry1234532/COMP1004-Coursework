<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href=".vscode/style.css">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    
    <div class="card weather-card shadow p-4 w-100" style="max-width: 600px;">

        <h1 class="text-center app-title mb-4">Weather App</h1>

        <div class="input-group mb-3">
            <input type="text" id="cityInput" class="form-control" placeholder="Enter city">
            <button class="btn btn-primary" onclick="getWeather()">Search</button>
        </div>

        <div id="output" class="text-center"></div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
