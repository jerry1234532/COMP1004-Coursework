<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <!-- LOGIN VIEW -->
    <div id="loginView" class="card weather-card shadow p-4 w-100" style="max-width: 400px;">
        <h2 class="text-center mb-4">Login</h2>

        <div id="loginOutput"></div>

        <input type="text" id="username" class="form-control mb-3" placeholder="Username">
        <input type="password" id="password" class="form-control mb-3" placeholder="Password">

        <button class="btn btn-primary w-100" onclick="login()">Login</button>
        
        <p class="text-center mt-3">
            Don't have an account? <a href="#" onclick="switchToRegister()">Register here</a>
        </p>
    </div>

    <!-- REGISTER VIEW -->
    <div id="registerView" class="card weather-card shadow p-4 w-100 d-none" style="max-width: 400px;">
        <h2 class="text-center mb-4">Register</h2>

        <div id="registerOutput"></div>

        <input type="text" id="regName" class="form-control mb-3" placeholder="Full Name">
        <input type="email" id="regEmail" class="form-control mb-3" placeholder="Email">
        <input type="password" id="regPassword" class="form-control mb-3" placeholder="Password">
        <input type="password" id="regVerifyPassword" class="form-control mb-3" placeholder="Verify Password">

        <button class="btn btn-success w-100" onclick="register()">Register</button>
        
        <p class="text-center mt-3">
            Already have an account? <a href="#" onclick="switchToLogin()">Login here</a>
        </p>
    </div>

    <!-- WEATHER APP VIEW -->
    <div id="appView" class="card weather-card shadow p-4 w-100 d-none" style="max-width: 600px;">

        <h1 class="text-center app-title mb-4">Weather App</h1>

        <div class="input-group mb-3">
            <input type="text" id="cityInput" class="form-control" placeholder="Enter city">
            <button class="btn btn-primary" onclick="getWeather()">Search</button>
        </div>

        <div id="output"></div>

        <button class="btn btn-danger mt-3" onclick="logout()">Logout</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
